set timeout=5
set default=0
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial console
terminal_output serial console

menuentry "SAN appliance installer shell (does not write a disk)" {
    linux /boot/vmlinuz console=ttyS0,115200
    initrd /boot/initrd.img
}

menuentry "Install SAN appliance onto the first empty disk" {
    linux /boot/vmlinuz san.install=1 console=ttyS0,115200
    initrd /boot/initrd.img
}
