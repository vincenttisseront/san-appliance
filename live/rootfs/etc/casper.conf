# Honour USERNAME and HOST. An empty FLAVOUR would let .disk/info replace them.
export USERNAME="sanadmin"
export USERFULLNAME="SAN appliance operator"
export HOST="san-appliance"
# casper only passes a quiet modprobe flag when this is Ubuntu or Debian.
# Any other value makes "modprobe overlay" fail and the live root never mounts.
export BUILD_SYSTEM="Ubuntu"
export FLAVOUR="san-appliance"
