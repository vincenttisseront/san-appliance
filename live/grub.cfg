set default=0
set timeout=10
set timeout_style=menu
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

# First entry is the live system. There is no installer and no automatic
# partitioning. nopersistent stops casper from creating a casper-rw volume.
menuentry "SAN appliance live" {
    linux /casper/vmlinuz boot=casper ignore_uuid nopersistent noprompt noeject quiet plymouth.enable=0 systemd.gpt_auto=0 username=sanadmin hostname=san-appliance console=tty0 console=ttyS0,115200 panic=30 ---
    initrd /casper/initrd
}

menuentry "SAN appliance diagnostic (no LUN export)" {
    linux /casper/vmlinuz boot=casper ignore_uuid nopersistent noprompt noeject quiet plymouth.enable=0 systemd.gpt_auto=0 san.mode=diagnostic username=sanadmin hostname=san-appliance console=tty0 console=ttyS0,115200 panic=30 ---
    initrd /casper/initrd
}
